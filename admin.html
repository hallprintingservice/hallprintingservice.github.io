<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Hall Printing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0a1730; --card:#132b56; --field:#0d1e40; --line:#28416f;
    --gold-1:#ffe08a; --gold-2:#ffb238; --gold-3:#ff8a1f;
    --text-hi:#f4f7ff; --text-lo:#93a6cf; --text-dim:#5f74a0;
    --danger:#ff6b6b; --ok:#57d99a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,var(--navy-deep) 0%,#0d1c3c 45%,#0a1730 100%);
    min-height:100vh; font-family:'Inter',sans-serif; color:var(--text-hi);
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 60px;}
  .hidden{display:none !important;}
  button{font-family:inherit;}

  /* ---------- Login ---------- */
  .login{max-width:360px; margin:0 auto; padding:90px 16px 0; text-align:center;}
  .login h1{font-family:'Baloo 2',sans-serif; font-size:26px; margin:0 0 4px; color:var(--gold-1);}
  .login p{color:var(--text-lo); font-size:13px; margin:0 0 22px;}
  .login .box{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px;}
  input[type=text], input[type=password], input[type=search], select{
    width:100%; padding:12px 13px; border-radius:11px; background:var(--field);
    border:1px solid var(--line); color:var(--text-hi); font-family:'Inter',sans-serif;
    font-size:15px; outline:none; appearance:none;
  }
  input:focus, select:focus{border-color:var(--gold-2);}
  .pin-input{text-align:center; letter-spacing:8px; font-size:20px !important;}
  .btn-main{
    width:100%; margin-top:12px; padding:13px; border:none; border-radius:12px;
    background:linear-gradient(135deg,var(--gold-1),var(--gold-3)); color:#241300;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; cursor:pointer;
  }
  .btn-main:disabled{opacity:.5; cursor:not-allowed;}
  .msg{font-size:12.5px; margin-top:12px; min-height:18px; color:var(--text-lo);}
  .msg.err{color:var(--danger);}

  /* ---------- Top bar ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 0 8px;}
  .topbar h1{font-family:'Baloo 2',sans-serif; font-size:20px; margin:0; color:var(--gold-1);}
  .topbar .upd{font-size:11px; color:var(--text-dim); margin-top:-2px;}
  .tb-actions{display:flex; gap:8px;}
  .icon-btn{
    background:var(--card); border:1px solid var(--line); color:var(--text-lo);
    border-radius:10px; padding:8px 11px; font-size:12.5px; font-weight:600; cursor:pointer;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; gap:6px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:5px; margin-top:8px; position:sticky; top:8px; z-index:5;
  }
  .tab{
    flex:1; padding:10px 6px; border:none; background:transparent; color:var(--text-lo);
    font-weight:700; font-size:13px; border-radius:10px; cursor:pointer;
  }
  .tab.active{background:linear-gradient(135deg,var(--gold-1),var(--gold-3)); color:#241300;}
  .tab .badge{
    display:inline-block; min-width:18px; padding:1px 6px; margin-left:4px; border-radius:20px;
    background:var(--danger); color:#fff; font-size:10.5px; font-weight:800;
  }
  .tab.active .badge{background:#241300; color:var(--gold-1);}

  /* ---------- Cards / stats ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px;}
  .card h3{margin:0 0 12px; font-size:13px; color:var(--gold-1); font-weight:700;}
  .seg{display:flex; gap:6px; margin-bottom:12px;}
  .seg button{
    flex:1; padding:8px 4px; border-radius:9px; border:1px solid var(--line);
    background:var(--field); color:var(--text-lo); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .seg button.active{border-color:var(--gold-2); color:var(--gold-2); background:rgba(255,178,56,.1);}

  .mini-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .mini{background:var(--field); border:1px solid var(--line); border-radius:11px; padding:10px 12px;}
  .mini .k{font-size:11px; color:var(--text-dim); font-weight:600;}
  .mini .v{font-family:'Baloo 2',sans-serif; font-size:19px; font-weight:800; margin-top:2px;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px;}
  .stat .k{font-size:11.5px; color:var(--text-lo); font-weight:600;}
  .stat .v{font-family:'Baloo 2',sans-serif; font-size:23px; font-weight:800; margin-top:2px; line-height:1.25;}
  .stat .s{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .c-gold{color:var(--gold-2);} .c-ok{color:var(--ok);} .c-danger{color:var(--danger);} .c-hi{color:var(--text-hi);}

  .bar{height:9px; border-radius:20px; background:var(--field); border:1px solid var(--line); overflow:hidden; margin:10px 0 6px;}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--gold-1),var(--gold-3)); border-radius:20px;}
  .bar-l{display:flex; justify-content:space-between; font-size:12px; color:var(--text-lo);}
  .bar-l b{color:var(--text-hi);}

  .row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13px; color:var(--text-lo);}
  .row:last-child{border-bottom:none;}
  .row b{color:var(--text-hi);}
  .tag{font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; margin-left:6px; border:1px solid var(--line); color:var(--text-dim);}
  .tag.biz{color:var(--ok); border-color:rgba(87,217,154,.4);}
  .foot-note{font-size:11px; color:var(--text-dim); line-height:1.6; margin-top:10px;}

  /* ---------- Pending ---------- */
  .pcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px;}
  .pcard .ph{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .pcard .pn{font-weight:700; font-size:14.5px;}
  .pcard .pt{font-size:11px; color:var(--text-dim); white-space:nowrap; margin-top:3px;}
  .pcard .pm{font-size:12.5px; color:var(--text-lo); margin-top:6px; line-height:1.6;}
  .chip{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; margin-right:5px;}
  .chip.later{background:rgba(255,178,56,.12); color:var(--gold-2); border:1px solid rgba(255,178,56,.35);}
  .chip.due{background:rgba(255,107,107,.12); color:var(--danger); border:1px solid rgba(255,107,107,.35);}
  .pa{display:flex; gap:8px; margin-top:12px;}
  .btn-open{
    flex:0 0 auto; padding:10px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--field); color:#7bb2ff; font-weight:700; font-size:12.5px; text-decoration:none; text-align:center;
  }
  .btn-done{
    flex:1; padding:10px; border-radius:10px; border:none; font-weight:800; font-size:13px; cursor:pointer;
    background:linear-gradient(135deg,#4ee89a,#1fa855); color:#04210f;
  }
  .btn-done:disabled{opacity:.5; cursor:wait;}
  .empty{text-align:center; color:var(--text-lo); font-size:14px; padding:40px 10px;}

  /* ---------- Customers ---------- */
  .filters{display:flex; gap:8px; margin-top:10px;}
  .filters select{flex:1; padding:10px 12px; font-size:13px;}
  .chips{display:flex; gap:6px; margin-top:10px;}
  .chips button{
    flex:1; padding:8px 4px; border-radius:9px; border:1px solid var(--line);
    background:var(--field); color:var(--text-lo); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .chips button.active{border-color:var(--gold-2); color:var(--gold-2); background:rgba(255,178,56,.1);}
  .sumline{font-size:12px; color:var(--text-lo); margin:12px 2px 0; display:flex; justify-content:space-between;}
  .crow{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-top:8px;
  }
  .crow .cn{font-weight:700; font-size:14px;}
  .crow .cs{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .crow .cb{text-align:right; flex-shrink:0;}
  .crow .cb .amt{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:17px;}
  .crow .cb .lbl{font-size:10.5px; font-weight:700;}

  @media (min-width: 900px){
    .wrap{max-width:900px;}
    .stat-grid{grid-template-columns:repeat(4,1fr);}
    .mini-grid{grid-template-columns:repeat(4,1fr);}
    #tab-pending, #tab-customers{display:block;}
    #list-pending{display:grid; grid-template-columns:1fr 1fr; gap:0 12px;}
    #list-customers{display:grid; grid-template-columns:1fr 1fr; gap:0 12px;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login" id="loginView">
  <h1>Hall Printing — Admin</h1>
  <p>শুধু মালিকের জন্য। PIN দিন।</p>
  <div class="box">
    <input type="password" id="pinInput" class="pin-input" inputmode="numeric" autocomplete="off" placeholder="••••" maxlength="12">
    <button class="btn-main" id="loginBtn">প্রবেশ করুন</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="wrap hidden" id="appView">
  <div class="topbar">
    <div>
      <h1>Admin Panel</h1>
      <div class="upd" id="updTime"></div>
    </div>
    <div class="tb-actions">
      <button class="icon-btn" id="refreshBtn">↻ রিফ্রেশ</button>
      <button class="icon-btn" id="logoutBtn">বের হন</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="summary">সারাংশ</button>
    <button class="tab" data-tab="pending">বাকি ফাইল<span class="badge" id="pendBadge">0</span></button>
    <button class="tab" data-tab="customers">কাস্টমার</button>
  </div>

  <!-- ---- সারাংশ ---- -->
  <div id="tab-summary">
    <div class="card">
      <h3>প্রিন্টের হিসাব (সময় অনুযায়ী)</h3>
      <div class="seg" id="periodSeg">
        <button data-p="today" class="active">আজ</button>
        <button data-p="month">এই মাস</button>
        <button data-p="all">সর্বমোট</button>
      </div>
      <div class="mini-grid" id="periodGrid"></div>
    </div>

    <div class="card">
      <h3>কাগজের হিসাব</h3>
      <div class="bar"><i id="paperBar" style="width:0%"></i></div>
      <div class="bar-l"><span>প্রিন্ট <b id="pgPrinted">0</b></span><span>বাকি <b id="pgRemain">0</b></span><span>মোট <b id="pgTotal">0</b></span></div>
    </div>

    <div class="stat-grid" id="statGrid"></div>

    <div class="card">
      <h3>খরচের তালিকা</h3>
      <div id="expList"></div>
    </div>
    <div class="foot-note" id="footNote"></div>
  </div>

  <!-- ---- বাকি ফাইল ---- -->
  <div id="tab-pending" class="hidden">
    <div class="sumline" id="pendSum"></div>
    <div id="list-pending"></div>
  </div>

  <!-- ---- কাস্টমার ---- -->
  <div id="tab-customers" class="hidden">
    <div style="margin-top:14px;"><input type="search" id="custSearch" placeholder="নাম দিয়ে খুঁজুন…"></div>
    <div class="chips" id="custChips">
      <button data-f="all" class="active">সব</button>
      <button data-f="due">বাকি</button>
      <button data-f="adv">অগ্রিম</button>
    </div>
    <div class="filters">
      <select id="custSort">
        <option value="name">নামের ক্রমে (A→Z)</option>
        <option value="amount">টাকার পরিমাণ (বেশি → কম)</option>
      </select>
    </div>
    <div class="sumline" id="custSum"></div>
    <div id="list-customers"></div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwGwthsCCAxH0DX2-ueLDSBW0JJuJOULqtkghDlPmhvdVnIS3nsHy5mhuSPnzFyOzg/exec";

let PIN = '';
let D = null;
let period = 'today';
let custFilter = 'all';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0  = v => Number(v || 0).toLocaleString('en-US', {maximumFractionDigits: 0});
const tk  = v => '৳' + Number(v || 0).toLocaleString('en-US', {maximumFractionDigits: 1});

async function api(payload){
  const res = await fetch(API, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({pin: PIN}, payload))
  });
  return res.json();
}

/* ---------- Login ---------- */
function setLoginMsg(t, err){ const m = $('loginMsg'); m.textContent = t || ''; m.className = 'msg' + (err ? ' err' : ''); }

async function login(pin){
  PIN = pin;
  $('loginBtn').disabled = true;
  setLoginMsg('চেক করা হচ্ছে…');
  try{
    const r = await api({action: 'dashboard'});
    if (r.status === 'ok'){
      try{ sessionStorage.setItem('hp_pin', pin); }catch(e){}
      D = r.data;
      $('loginView').classList.add('hidden');
      $('appView').classList.remove('hidden');
      renderAll();
    } else {
      PIN = '';
      try{ sessionStorage.removeItem('hp_pin'); }catch(e){}
      $('loginView').classList.remove('hidden');
      $('appView').classList.add('hidden');
      setLoginMsg(r.message || 'ভুল হয়েছে', true);
    }
  }catch(err){
    console.error(err);
    PIN = '';
    setLoginMsg('সংযোগে সমস্যা হয়েছে। আবার চেষ্টা করুন।', true);
  }
  $('loginBtn').disabled = false;
}

$('loginBtn').addEventListener('click', () => {
  const p = $('pinInput').value.trim();
  if (p) login(p);
});
$('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

$('logoutBtn').addEventListener('click', () => {
  try{ sessionStorage.removeItem('hp_pin'); }catch(e){}
  PIN = ''; D = null;
  $('pinInput').value = '';
  setLoginMsg('');
  $('appView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
});

$('refreshBtn').addEventListener('click', async () => {
  const b = $('refreshBtn');
  b.disabled = true; b.textContent = '…';
  try{
    const r = await api({action: 'dashboard'});
    if (r.status === 'ok'){ D = r.data; renderAll(); }
    else alert(r.message || 'রিফ্রেশ করতে সমস্যা হয়েছে');
  }catch(e){ alert('সংযোগে সমস্যা হয়েছে'); }
  b.disabled = false; b.textContent = '↻ রিফ্রেশ';
});

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  ['summary','pending','customers'].forEach(k => $('tab-' + k).classList.toggle('hidden', k !== t.dataset.tab));
}));

/* ---------- Render ---------- */
function renderAll(){
  $('updTime').textContent = 'আপডেট: ' + D.updated;
  renderSummary();
  renderPending();
  renderCustomers();
}

function renderPeriod(){
  const p = D.periods[period];
  $('periodGrid').innerHTML = `
    <div class="mini"><div class="k">প্রিন্ট পেজ</div><div class="v c-gold">${n0(p.pages)}</div></div>
    <div class="mini"><div class="k">ফাইল</div><div class="v">${n0(p.files)}</div></div>
    <div class="mini"><div class="k">মোট বিল</div><div class="v">${tk(p.bill)}</div></div>
    <div class="mini"><div class="k">নগদ আদায়</div><div class="v c-ok">${tk(p.cash)}</div></div>`;
  document.querySelectorAll('#periodSeg button').forEach(b => b.classList.toggle('active', b.dataset.p === period));
}
document.querySelectorAll('#periodSeg button').forEach(b => b.addEventListener('click', () => {
  period = b.dataset.p; if (D) renderPeriod();
}));

function renderSummary(){
  renderPeriod();
  const pg = D.pages, m = D.money, c = D.counts;

  const pct = pg.total > 0 ? Math.min(100, Math.max(0, pg.printed / pg.total * 100)) : 0;
  $('paperBar').style.width = pct + '%';
  $('pgPrinted').textContent = n0(pg.printed);
  $('pgRemain').textContent  = n0(pg.remaining);
  $('pgTotal').textContent   = n0(pg.total);

  const stats = [
    ['মোট প্রিন্ট পেজ',  n0(pg.printed),   'c-gold',   'শুরু থেকে এখন পর্যন্ত'],
    ['বাকি পেজ (কাগজ)', n0(pg.remaining), pg.remaining < 500 ? 'c-danger' : 'c-hi', 'মোট ' + n0(pg.total) + ' পেজের মধ্যে'],
    ['Cash Received',    tk(m.cash),       'c-ok',     'কাস্টমারদের থেকে পাওয়া'],
    ['Due (মোট বাকি)',   tk(m.due),        'c-danger', c.dueCustomers + ' জনের কাছে'],
    ['Advance (অগ্রিম)', tk(m.advance),    'c-gold',   c.advCustomers + ' জনের জমা'],
    ['Hand Cash',        tk(m.hand),       'c-ok',     'Cash − খরচ − Given'],
    ['Expense (খরচ)',    tk(m.expense),    'c-hi',     'Business খরচ'],
    ['Profit',           tk(m.profit),     'c-ok',     'মোট বিল − খরচ']
  ];
  $('statGrid').innerHTML = stats.map(s =>
    `<div class="stat"><div class="k">${s[0]}</div><div class="v ${s[2]}">${s[1]}</div><div class="s">${s[3]}</div></div>`
  ).join('');

  $('expList').innerHTML = D.expenseByType.length
    ? D.expenseByType.map(e =>
        `<div class="row"><span>${esc(e.type || '—')}<span class="tag ${e.source.toLowerCase()==='business'?'biz':''}">${esc(e.source || '—')}</span></span><b>${tk(e.amount)}</b></div>`
      ).join('') +
      `<div class="row"><span>Business মোট</span><b class="c-hi">${tk(m.expense)}</b></div>` +
      `<div class="row"><span>Personal মোট</span><b class="c-hi">${tk(m.personalExpense)}</b></div>`
    : '<div class="empty" style="padding:10px;">কোনো খরচ পাওয়া যায়নি</div>';

  $('footNote').innerHTML =
    `Given: <b>${tk(m.given)}</b> (Summary ট্যাবের A8 থেকে) • নিট বাকি (বিল − নগদ): <b>${tk(m.netDue)}</b>`;
}

function renderPending(){
  const list = D.pending;
  $('pendBadge').textContent = list.length;
  $('pendBadge').classList.toggle('hidden', list.length === 0);
  $('pendSum').innerHTML = list.length
    ? `<span>মোট <b>${list.length}</b> ফাইল</span><span><b>${n0(D.counts.pendingPages)}</b> পেজ প্রিন্ট বাকি</span>`
    : '';

  if (!list.length){
    $('list-pending').innerHTML = '<div class="empty">🎉 সব ফাইল প্রিন্ট হয়ে গেছে</div>';
    return;
  }
  $('list-pending').innerHTML = list.map(p => `
    <div class="pcard" data-row="${p.row}">
      <div class="ph">
        <div class="pn">${esc(p.name)}</div>
        <div class="pt">${esc(p.time)}</div>
      </div>
      <div class="pm">
        ${p.later ? '<span class="chip later">পরে নিবে</span>' : ''}
        ${p.due > 0 ? `<span class="chip due">বাকি ${tk(p.due)}</span>` : ''}
        <br>${esc(p.type)} • ${n0(p.pages)} পেজ/কপি • ${tk(p.price)}
      </div>
      <div class="pa">
        ${p.url ? `<a class="btn-open" href="${esc(p.url)}" target="_blank" rel="noopener">ফাইল খুলুন</a>` : ''}
        <button class="btn-done" data-row="${p.row}">প্রিন্ট হয়েছে ✓</button>
      </div>
    </div>`).join('');
}

$('list-pending').addEventListener('click', async e => {
  const btn = e.target.closest('.btn-done');
  if (!btn) return;
  const row = parseInt(btn.dataset.row, 10);
  const item = D.pending.find(p => p.row === row);
  if (!item) return;
  btn.disabled = true; btn.textContent = 'হচ্ছে…';
  try{
    const r = await api({action: 'markPrinted', row: item.row, name: item.rawName});
    if (r.status === 'ok'){
      D.pending = D.pending.filter(p => p.row !== row);
      D.counts.pendingFiles = D.pending.length;
      D.counts.pendingPages = D.pending.reduce((s, p) => s + (p.pages || 0), 0);
      renderPending();
    } else {
      alert(r.message || 'সমস্যা হয়েছে');
      btn.disabled = false; btn.textContent = 'প্রিন্ট হয়েছে ✓';
    }
  }catch(err){
    alert('সংযোগে সমস্যা হয়েছে');
    btn.disabled = false; btn.textContent = 'প্রিন্ট হয়েছে ✓';
  }
});

function renderCustomers(){
  const q = $('custSearch').value.trim().toLowerCase();
  const sort = $('custSort').value;

  let list = D.customers.filter(c => {
    if (q && !c.name.toLowerCase().includes(q)) return false;
    if (custFilter === 'due') return c.balance > 0;
    if (custFilter === 'adv') return c.balance < 0;
    return true;
  });

  if (sort === 'amount') list = list.slice().sort((a, b) => Math.abs(b.balance) - Math.abs(a.balance));

  const dueSum = list.reduce((s, c) => s + (c.balance > 0 ? c.balance : 0), 0);
  const advSum = list.reduce((s, c) => s - (c.balance < 0 ? c.balance : 0), 0);
  $('custSum').innerHTML = `<span><b>${list.length}</b> জন</span><span>বাকি <b class="c-danger">${tk(dueSum)}</b> • অগ্রিম <b class="c-gold">${tk(advSum)}</b></span>`;

  if (!list.length){
    $('list-customers').innerHTML = '<div class="empty">কোনো কাস্টমার পাওয়া যায়নি</div>';
    return;
  }
  $('list-customers').innerHTML = list.map(c => {
    let amt, lbl, cls;
    if (c.balance > 0){ amt = tk(c.balance); lbl = 'বাকি'; cls = 'c-danger'; }
    else if (c.balance < 0){ amt = tk(-c.balance); lbl = 'অগ্রিম'; cls = 'c-gold'; }
    else { amt = '৳0'; lbl = 'পরিশোধিত'; cls = 'c-ok'; }
    return `<div class="crow">
      <div><div class="cn">${esc(c.name)}</div><div class="cs">বিল ${tk(c.bill)} • পরিশোধ ${tk(c.paid)} • ${c.files} ফাইল</div></div>
      <div class="cb"><div class="amt ${cls}">${amt}</div><div class="lbl ${cls}">${lbl}</div></div>
    </div>`;
  }).join('');
}

$('custSearch').addEventListener('input', () => D && renderCustomers());
$('custSort').addEventListener('change', () => D && renderCustomers());
document.querySelectorAll('#custChips button').forEach(b => b.addEventListener('click', () => {
  custFilter = b.dataset.f;
  document.querySelectorAll('#custChips button').forEach(x => x.classList.toggle('active', x === b));
  if (D) renderCustomers();
}));

  let saved = '';
  try{ saved = sessionStorage.getItem('hp_pin') || ''; }catch(e){}
  if (saved) login(saved);
})();
